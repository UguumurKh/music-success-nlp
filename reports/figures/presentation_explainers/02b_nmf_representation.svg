  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d4e" x="51.84" y="42.12" transform="rotate(-0 51.84 42.12)">How does NMF make a smaller representation?</text>
  </g>
  <g id="text_6">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758a" x="51.84" y="74.52" transform="rotate(-0 51.84 74.52)">CONCEPTUAL SCHEMATIC  |  Non-negative matrix factorization; no fitted values shown</text>
  </g>
  <g id="text_7">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 582.749063)">Component weights are non-negative strengths, not probabilities or song percentages.</text>
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 605.249063)">Learn NMF on training songs during validation; the all-data descriptive fit is separate.</text>
