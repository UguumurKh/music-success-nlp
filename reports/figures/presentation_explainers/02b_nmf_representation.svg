   <g id="text_4">
    <text style="font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #142d4e" x="576" y="462.024" transform="rotate(-0 576 462.024)">Each component is a learned pattern of words that occur together.</text>
