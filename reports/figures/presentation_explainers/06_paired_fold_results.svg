  <g id="text_33">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 582.749063)">Focused x-axis (0.195–0.280). AP summarizes precision across recall increments; it is not accuracy.</text>
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 605.249063)">Fold variation is descriptive: folds share training songs and are not independent replicates for a simple significance test.</text>
