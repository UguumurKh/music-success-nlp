  <g id="text_36">
   <text style="font-weight: 700; font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d4e" x="51.84" y="42.12" transform="rotate(-0 51.84 42.12)">How are models evaluated on held-out songs?</text>
  </g>
  <g id="text_37">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #63758a" x="51.84" y="74.52" transform="rotate(-0 51.84 74.52)">ACTUAL DESIGN  |  Five fixed group partitions, reused for every model</text>
  </g>
  <g id="text_38">
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(172.8 475.44)">Learn vocabulary, TF-IDF weights, NMF and classifier on training songs.</text>
   <text style="font-size: 20px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(172.8 505.44)">Apply the fitted steps to held-out songs.</text>
  </g>
  <g id="text_39">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 582.749063)">Columns are groups of songs, not individual songs. Group links include full artist credits and known shared texts.</text>
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; fill: #142d4e" transform="translate(51.84 605.249063)">Complete-credit grouping leaves collaboration overlap risk; this is not fully unseen-performer evaluation.</text>
  </g>
